[project]
name = "element-aware-chunking"
version = "0.1.0"
description = "Element-aware chunking design patterns for RAG — text, tables & images with Qdrant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "fastembed>=0.4",
    "qdrant-client>=1.12",
    "streamlit>=1.40",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/element_aware_chunking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
